syntax = "proto3";

package fleet.telemetry.v1;

option go_package = "github.com/itsnairr/fleet-telemetry-engine/internal/protocol";

message GPSLocation {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  double speed = 4;
  double heading = 5;
  double pdop = 6;
  double hdop = 7;
  string location_provider = 8;
}

enum Gear {
  GEAR_UNSPECIFIED = 0;
  GEAR_PARK = 1;
  GEAR_REVERSE = 2;
  GEAR_NEUTRAL = 3;
  GEAR_DRIVE = 4;
}

message BatteryState {
  enum BatteryStatus {
    BATTERY_STATUS_UNSPECIFIED = 0;
    BATTERY_STATUS_OK = 1;
    BATTERY_STATUS_CHARGING = 2;
    BATTERY_STATUS_DISCHARGING = 3;
    BATTERY_STATUS_FAULT = 4;
  }

  repeated float cell_voltage = 1;
  float state_of_charge = 2;
  float pack_voltage = 3;
  float pack_current = 4;
  float max_cell_temperature = 5;
  float min_cell_temperature = 6;
  float pack_temperature = 7;
  float pack_power = 8;
  float pack_health = 9;
  float pack_remaining_capacity = 10;
  int32 pack_cycle_count = 11;
  BatteryStatus pack_status = 12;
  float min_cell_voltage = 13;
  float max_cell_voltage = 14;
  float low_voltage_battery_volts = 15; // 12V / 16V auxiliary battery
}

message ChargingState {
  enum ChargeState {
    CHARGE_STATE_UNSPECIFIED = 0;
    CHARGE_STATE_DISCONNECTED = 1;
    CHARGE_STATE_CONNECTED = 2;
    CHARGE_STATE_CHARGING = 3;
    CHARGE_STATE_COMPLETE = 4;
    CHARGE_STATE_STOPPED = 5;
    CHARGE_STATE_FAULT = 6;
  }

  enum ChargerType {
    CHARGER_TYPE_UNSPECIFIED = 0;
    CHARGER_TYPE_AC_LEVEL_1 = 1;
    CHARGER_TYPE_AC_LEVEL_2 = 2;
    CHARGER_TYPE_DC_FAST = 3;
  }

  ChargeState state = 1;
  ChargerType charger_type = 2;
  bool charge_port_door_open = 3;
  bool charge_port_latch_engaged = 4;

  // Electrical metrics
  float charger_voltage = 5;          // Volts (AC RMS or DC)
  float charger_actual_current = 6;    // Amperes
  float charger_pilot_current = 7;     // Max available current offered by EVSE
  int32 charger_phases = 8;            // 1 or 3 phase AC
  float charging_power_kw = 9;         // Instantaneous kW

  // Session & Progress metrics
  float session_energy_added_kwh = 10;
  float charge_rate_km_per_hour = 11;
  int32 minutes_to_full_charge = 12;
  int32 charge_limit_soc_pct = 13;     // Target SoC limit (e.g. 80%)
  bool battery_preconditioning = 14;   // Battery heating for fast charging
}

message MotorState {
  enum MotorPosition {
    MOTOR_POSITION_UNSPECIFIED = 0;
    // Single / Axle-based dual motor setups (Tesla Model 3/Y, Ford, etc.)
    MOTOR_POSITION_FRONT = 1;
    MOTOR_POSITION_REAR = 2;
    // Independent wheel quad-motor setups (Rivian R1T Quad, Cybertruck Cyberbeast, etc.)
    MOTOR_POSITION_FRONT_LEFT = 3;
    MOTOR_POSITION_FRONT_RIGHT = 4;
    MOTOR_POSITION_REAR_LEFT = 5;
    MOTOR_POSITION_REAR_RIGHT = 6;
  }

  enum MotorStatus {
    MOTOR_STATUS_UNSPECIFIED = 0;
    MOTOR_STATUS_READY_TO_DRIVE = 1;
    MOTOR_STATUS_READY_TO_CHARGE = 2;
    MOTOR_STATUS_FAULT = 3;
  }

  MotorPosition position = 1;
  int32 rpm = 2;
  float inverter_temp_celsius = 3;
  float dc_bus_current = 4;
  float dc_bus_voltage = 5;
  float motor_temp_celsius = 6;
  float throttle_position_pct = 7;
  float torque_nm = 8;
  float power_kw = 9;
  MotorStatus status = 10;
}

message TirePressure {
  float front_left_bar = 1;
  float front_right_bar = 2;
  float rear_left_bar = 3;
  float rear_right_bar = 4;
}

message CabinState {
  float inside_temp_celsius = 1;
  float outside_temp_celsius = 2;
  bool climate_on = 3;
  bool is_locked = 4;
  bool sentry_or_guard_mode_active = 5; // Camera security (Tesla Sentry / Rivian Gear Guard)

  // Passenger closures (Sedans, SUVs, Trucks)
  bool driver_door_open = 6;
  bool passenger_door_open = 7;
  bool rear_left_door_open = 8;
  bool rear_right_door_open = 9;
  bool frunk_open = 10;
  bool trunk_or_liftgate_open = 11;     // Passenger car trunk or SUV rear liftgate
}

// Active/Air Suspension & Inclinometer (Rivian R1T, Cybertruck, Model S/X, etc.)
message SuspensionState {
  enum RideHeight {
    RIDE_HEIGHT_UNSPECIFIED = 0;
    RIDE_HEIGHT_VERY_LOW = 1;
    RIDE_HEIGHT_LOW = 2;
    RIDE_HEIGHT_STANDARD = 3;
    RIDE_HEIGHT_HIGH = 4;
    RIDE_HEIGHT_VERY_HIGH = 5;
  }

  RideHeight ride_height = 1;
  float ground_clearance_mm = 2;
  float pitch_degrees = 3; // Inclinometer: front/rear pitch (camp mode auto-leveling & off-roading)
  float roll_degrees = 4;  // Inclinometer: side-to-side roll
}

// ============================================================================
// TRUCK-SPECIFIC TELEMETRY
// Explicitly populated for electric pickup trucks (Rivian R1T, Ford F-150
// Lightning, Tesla Cybertruck, Silverado EV). Omitted/nil for sedans/SUVs.
// ============================================================================
message TruckState {
  // --- Truck Bed & Tailgate Closures ---
  bool tailgate_open = 1;
  int32 tonneau_cover_pct_open = 2;       // 0 = fully closed, 100 = fully open
  bool gear_tunnel_left_open = 3;         // [Rivian R1T specific]
  bool gear_tunnel_right_open = 4;        // [Rivian R1T specific]

  // --- Towing & Trailer Subsystem ---
  bool trailer_connected = 5;             // Detected via 7-pin trailer connector
  float estimated_trailer_weight_kg = 6;  // Auto-calculated from motor torque vs acceleration
  float trailer_brake_gain = 7;           // Integrated trailer brake controller gain (0.0 - 10.0)
  bool tow_mode_active = 8;

  // --- Work & Exportable Power (Vehicle-to-Load / V2L) ---
  bool bed_outlets_active = 9;            // 120V / 240V AC power outlets in the bed
  float bed_outlets_power_kw = 10;        // Instantaneous power draw from bed outlets
}

message VehicleTelemetry {
  string vin = 1;
  int64 timestamp_ms = 2;
  GPSLocation location = 3;

  // Dynamics & Driver Controls
  Gear gear = 4;
  float speed_kmh = 5;
  float brake_pedal_pct = 6;
  float odometer_km = 7;
  float remaining_range_km = 8;
  string vehicle_mode = 9; // e.g., "Standard", "Chill", "All-Terrain", "Conserve", "Tow"

  // Common EV Subsystems (All vehicles: Sedan, SUV, Truck, Van)
  BatteryState battery_state = 10;
  ChargingState charging_state = 11;
  repeated MotorState motor_states = 12; // 1 (RWD), 2 (Dual-Motor AWD), or 4 (Quad-Motor)
  TirePressure tire_pressure = 13;
  CabinState cabin_state = 14;

  // Optional: Active/Air Suspension (Trucks, SUVs, and high-end EVs)
  SuspensionState suspension_state = 15;

  // Explicit Truck-Specific Subsystem (Rivian R1T, F-150 Lightning, Cybertruck)
  // Left unset/nil for passenger sedans like Tesla Model 3.
  TruckState truck_state = 16;

  // Active Diagnostic Trouble Codes / Alerts
  repeated string active_alert_codes = 17;
}

message VehicleAlert {
  enum AlertLevel {
    ALERT_LEVEL_UNSPECIFIED = 0;
    ALERT_LEVEL_INFO = 1;
    ALERT_LEVEL_WARNING = 2;
    ALERT_LEVEL_ERROR = 3;
    ALERT_LEVEL_CRITICAL = 4;
  }

  string vin = 1;
  int64 timestamp_ms = 2;
  GPSLocation location = 3;
  AlertLevel level = 4;
  string code = 5;
  string description = 6;
  map<string, string> metadata = 7;
}